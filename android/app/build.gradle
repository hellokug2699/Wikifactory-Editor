plugins {
    id 'com.android.application'
}

// Injected by scripts/version.mjs through Gradle properties; the inline values
// are only a fallback so Android Studio can open the project without env vars.
def appVersionName = project.findProperty('appVersionName') ?: '1.3.0'
def appVersionCode = (project.findProperty('appVersionCode') ?: '10300').toInteger()

android {
    namespace 'top.wikifactory.editor'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'top.wikifactory.editor'
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
