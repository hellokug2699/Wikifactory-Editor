name: Android release APK

# Builds an APK signed with the maintainer's release keystore.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    single-line base64 of the .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# The workflow never creates or stores a key: signing only succeeds when the
# four secrets above are present. Trigger it manually to download an artifact,
# or publish a GitHub Release to attach the signed APK to it.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run self-tests
        run: npm test

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          B64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \t\r\n')"
          B64="${B64//-/+}"
          B64="${B64//_//}"
          while [ $(( ${#B64} % 4 )) -ne 0 ]; do B64="${B64}="; done
          printf '%s' "$B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build and sign release APK
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android-release.mjs

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikifactory-editor-release-apk
          path: dist/Wikifactory-Editor-*-android-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/Wikifactory-Editor-*-android-release.apk --clobber
