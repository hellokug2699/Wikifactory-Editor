name: Android release APK

# Builds an APK signed with the maintainer's release keystore.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    single-line base64 of the .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# The workflow never creates or stores a key: signing only succeeds when the
# four secrets above are present. Trigger it manually to download an artifact,
# or publish a GitHub Release to attach the signed APK to it.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run self-tests
        run: npm test

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - "$RUNNER_TEMP/release.jks" <<'PY'
          import base64, os, sys

          raw = os.environ.get("ANDROID_KEYSTORE_BASE64", "")
          clean = "".join(raw.split()).replace("-", "+").replace("_", "/").rstrip("=")
          clean += "=" * ((-len(clean)) % 4)
          try:
              data = base64.b64decode(clean, validate=True)
          except Exception as exc:
              print(f"keystore base64 decode failed: {type(exc).__name__}: {exc}")
              sys.exit(1)
          if len(data) < 256:
              print(f"keystore file is too small ({len(data)} bytes)")
              sys.exit(1)
          with open(sys.argv[1], "wb") as handle:
              handle.write(data)
          print(f"keystore bytes: {len(data)}")
          PY
          test -s "$RUNNER_TEMP/release.jks"

      - name: Validate release keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
              -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null; then
            echo "::error::无法读取 release keystore。请确认 ANDROID_KEYSTORE_BASE64 是用 base64 -w0 release.jks 生成的完整单行文本（复制时不要漏掉末尾字符），并确认密码与别名匹配。"
            exit 1
          fi

      - name: Build and sign release APK
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android-release.mjs

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikifactory-editor-release-apk
          path: dist/Wikifactory-Editor-v${{ steps.version.outputs.version }}-android-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "dist/Wikifactory-Editor-v${{ steps.version.outputs.version }}-android-release.apk" --clobber
