name: Desktop & web release

# Builds the Windows portable ZIP, the updater resource bundle and the web ZIP,
# then attaches them (plus SHA-256 sums) to the published GitHub Release.
# Android is handled separately by android-release.yml.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip curl

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: npm run lint && npm test

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build web bundle
        run: npm run build:web

      - name: Build Windows bundle and updater resources
        run: npm run build:desktop

      - name: Write checksums
        run: |
          cd dist
          sha256sum Wikifactory-Editor-v*-windows-x64.zip \
            Wikifactory-Editor-v*-windows-x64-resources.neu \
            Wikifactory-Editor-v*-web.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            dist/Wikifactory-Editor-v${{ steps.version.outputs.version }}-windows-x64.zip
            dist/Wikifactory-Editor-v${{ steps.version.outputs.version }}-windows-x64-resources.neu
            dist/Wikifactory-Editor-v${{ steps.version.outputs.version }}-web.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach assets to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/Wikifactory-Editor-v${{ steps.version.outputs.version }}-windows-x64.zip" \
            "dist/Wikifactory-Editor-v${{ steps.version.outputs.version }}-windows-x64-resources.neu" \
            "dist/Wikifactory-Editor-v${{ steps.version.outputs.version }}-web.zip" \
            "dist/SHA256SUMS.txt" \
            --clobber
